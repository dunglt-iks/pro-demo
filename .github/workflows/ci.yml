# Kiểm tra BE + FE theo CLAUDE.md "Trước khi commit", thêm go test. Xanh trên main → deploy-dev.yml chạy tiếp.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (BE + FE)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: be/go.mod
          cache-dependency-path: be/go.sum
      - name: gofmt
        working-directory: be
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Chưa gofmt:"; echo "$out"; exit 1; fi
      - name: go vet
        working-directory: be
        run: go vet ./...
      - name: go build
        working-directory: be
        run: go build ./...
      - name: go test
        working-directory: be
        run: go test -count=1 ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: npm ci
        working-directory: fe
        run: npm ci --no-audit --no-fund
      - name: lint
        working-directory: fe
        run: npm run lint
      - name: build
        working-directory: fe
        run: npm run build
